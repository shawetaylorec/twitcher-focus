<style>
  /* One deliberate look: everything is written in the album's handwriting
     (Kalam), the hide is drawn like the birds, and the album is black paper
     with polaroids dated in marker. The map is still pixel art. Single theme
     on purpose. */
  :root {
    color-scheme: light;
    --ink: #303038;
    --ink-soft: #6a6a78;
    --box: #f8f8f0;
    --edge: #3868a8;
    --edge-2: #a8c0e8;
    --red: #e84030;
    --gold: #f8c830;
    --board: #1d2a23;
    --paper: #fbfaf6;
    --stamp: #ff8b2e;
    --page: #d8e8d0;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 400 18px/1.35 "Kalam", cursive;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* a menu box with a double border */
  .box {
    background: var(--box); border: 3px solid var(--edge); border-radius: 8px;
    box-shadow: inset 0 0 0 2px var(--edge-2), 0 3px 0 rgba(0,0,0,.12); padding: 12px 14px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--red); color: #fff; border: 3px solid #a82820; border-radius: 8px;
    padding: 10px 16px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 #a82820; min-height: 48px;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a82820; }
  .btn.quiet { background: var(--box); color: var(--ink); border-color: var(--edge); box-shadow: 0 3px 0 var(--edge); }
  .btn[disabled] { opacity: .45; cursor: default; transform: none; }

  header.top {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px; background: var(--edge); color: #fff;
  }
  header.top .gamedate { font-weight: 600; }
  header.top .stats { display: flex; gap: 12px; font-size: 15px; }
  header.top .stats b { color: var(--gold); font-weight: 600; }

  main { flex: 1; padding: 12px 12px 90px; display: grid; gap: 12px; align-content: start; }
  .screen[hidden] { display: none !important; }
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center; gap: 6px;
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px); background: var(--edge);
  }
  nav.tabs button {
    flex: 1; max-width: 150px; min-height: 48px; background: var(--edge-2); color: var(--ink);
    border: 3px solid #fff; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  nav.tabs button[aria-selected="true"] { background: #fff; color: var(--edge); }

  canvas.pix { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; }
  .mapwrap { position: relative; }
  .mapwrap canvas { margin: 0 auto; border: 3px solid var(--edge); border-radius: 8px; background: #5890d8; touch-action: manipulation; }

  .sitecard h2, .h { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .muted { color: var(--ink-soft); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #e8e8e0; font-size: 15px; }
  .chip.red { background: var(--red); color: #fff; }
  .chip.gold { background: var(--gold); }

  .band { margin: 8px 2px 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--edge); font-weight: 600; }

  .hidewrap svg { display: block; width: 100%; height: auto; border: 3px solid #3a2414; border-radius: 8px; box-sizing: border-box; }
  .timer { font: 400 44px/1 "Share Tech Mono", ui-monospace, monospace; text-align: center; letter-spacing: .04em; }
  .slots { display: flex; justify-content: center; gap: 8px; }
  .slot { min-width: 44px; padding: 0 4px; height: 26px; border-radius: 5px; border: 2px solid var(--ink-soft); display: grid; place-items: center; font-size: 13px; color: var(--ink-soft); }
  .slot.on { background: var(--gold); border-color: #a88010; color: var(--ink); }

  /* the album: black paper, photo prints, white ink */
  .albumpage { background: var(--board); color: #f1eee4; border-radius: 8px; padding: 12px; }
  .albumpage .h { color: #f1eee4; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { background: none; border: 0; padding: 0; cursor: pointer; text-align: center; color: #f1eee4; display: grid; gap: 4px; }
  /* a polaroid: a deep white strip at the bottom with the date in marker */
  .print { background: var(--paper); padding: 6% 6% 0; box-shadow: 0 6px 12px rgba(0,0,0,.4); position: relative; transform: rotate(var(--tilt, 0deg)); }
  .print svg { display: block; width: 100%; height: auto; }
  .card .nm { font: 700 15px/1.1 "Kalam", cursive; }
  .card .no { font: 400 11px/1 "Share Tech Mono", monospace; color: #aeb8a9; }
  .unknown { aspect-ratio: 1 / 1.16; background: #2a3a30; border: 2px dashed #4a5a50; display: grid; place-items: center; color: #6a7a70; font-size: 28px; }
  .date { display: block; height: 2.5em; font: 400 12px/2.5 "Permanent Marker", cursive; color: #26262c; transform: rotate(-2deg); white-space: nowrap; }
  .bigprint { max-width: 320px; margin: 0 auto; }
  .bigprint .date { font-size: 22px; }
  .caption { text-align: center; font-family: "Kalam", cursive; color: #f1eee4; display: grid; gap: 2px; margin-top: 12px; }
  .caption .nm { font-size: 28px; font-weight: 700; }
  .caption .sci { font-style: italic; color: #aeb8a9; font-family: Georgia, serif; }

  .grouphead { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; }
  .grouphead .band { margin: 0; color: #aeb8a9; }
  .gcount { font: 400 12px/1 "Share Tech Mono", monospace; color: #aeb8a9; }
  .grouphead.done .band, .grouphead.done .gcount { color: var(--gold); }
  .bonus { color: var(--gold); }

  /* the ticket: cream card, orange bands, printed in capitals. Sized in cqw so
     it reads the same at any width. No real railway's logo on purpose. */
  .tkcard { position: relative; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 85.6 / 54; perspective: 1000px; cursor: pointer; }
  .tkcard .faces { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s; }
  .tkcard.flipped .faces { transform: rotateY(180deg); }
  .tkcard:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 12px; }
  .ticket {
    container-type: inline-size; position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: grid; grid-template-rows: 12% 1fr 9%; background: #f6efda; color: #1f1f24; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 18px rgba(0,0,0,.4); font-family: "Share Tech Mono", ui-monospace, monospace; text-transform: uppercase;
  }
  .tk-band {
    display: flex; justify-content: space-between; align-items: center; padding: 0 4cqw; color: #fff4e4;
    font-size: 3.3cqw; letter-spacing: .14em; background: repeating-linear-gradient(90deg, #ec7424 0 2px, #f1873a 2px 5px);
  }
  .tk-band.low { justify-content: center; font-size: 2.7cqw; letter-spacing: .08em; }
  .tk-body { display: grid; grid-template-columns: 0.8fr 1fr 1fr; gap: 1.4cqw 3cqw; padding: 2.6cqw 4.4cqw; align-content: start; }
  .tk-f { display: grid; min-width: 0; }
  .tk-f small { font-size: 2.5cqw; letter-spacing: .06em; color: #b5561c; }
  .tk-f b { font-size: 4.1cqw; font-weight: 400; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk-f.two { grid-column: span 2; }
  .tk-f.wide { grid-column: 1 / -1; }
  .tk-f.route b { white-space: normal; font-size: 3.4cqw; }
  .tk-f.big b { font-size: 6.4cqw; }
  .clip { position: absolute; width: 4.4cqw; height: 4.4cqw; background: var(--board); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .clip.fresh { animation: clip .5s .6s both; }
  @keyframes clip { from { transform: scale(0); } 60% { transform: scale(1.4); } to { transform: scale(1); } }
  .tkwrap { animation: print .7s ease-out both; }
  .tkwrap .tkcard, .tkwrap .railcard { transform: rotate(-2deg); }
  @keyframes print { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .wallet { margin-top: 22px; }
  .wallet summary { cursor: pointer; font: 700 18px/1.4 "Kalam", cursive; color: #f1eee4; padding: 6px 2px; }
  .ticket.back { transform: rotateY(180deg); display: block; background: #efe6cc; }
  .tk-stripe { position: absolute; left: 0; right: 0; top: 12%; height: 17%; background: #4a3a30; }

<script>
/* Twitcher bird rig: every bird in the album is a recipe for one of these body
   plans, in the style of style/six-birds.html: flat shapes, round bodies, a
   dot for an eye, no outlines. BIRD_RIG.svg(recipe) returns an <svg> string,
   viewBox 0 0 200 200, bird facing left.

   Body plans (t):
     perch ground wader water   songbirds, thrushes, crows, waders, wildfowl
     tall                       egrets, cranes, bittern, spoonbill, ibis: long head, S neck
     heron                      the grey heron, drawn on its own
     upright                    auks, cormorants, shags: body stood on end
     cling                      woodpeckers, nuthatch, treecreeper, on a trunk to the left
     raptor                     birds of prey sat up on a post
     owl                        owls, body side on, face turned three-quarters to us
     game                       grouse, partridge, capercaillie
     fly                        swifts, swallows and martins, seen from above
     glide                      terns, gulls and seabirds, side on in flight

   rotates clockwise, so a head on the left goes up.)

   - no displacement filter: the "hand-cut" wobble read as jagged at card size

        o += '<rect y="' + (gy - 10) + '" width="200" height="' + (210 - gy) + '" fill="' + (kind === "stream" ? "#8fbdbc" : "#8dbccb") + '"/>' + ripples(gy - 6, "#b8d8e0");

      case "rock":

      case "trunk":

        return o + '<rect x="142" width="58" height="200" fill="#8c6b4b"/><rect x="142" width="8" height="200" fill="#9d7c5c"/>' + E(170, 60, 3, 16, "#7a5c3f") + E(184, 140, 3, 20, "#7a5c3f") + E(162, 170, 2.5, 12, "#7a5c3f");

      case "dawn":    // a capercaillie lek among misty pines

          o += P(M(t[0], t[1]) + " L" + (t[0] + 16) + " " + (t[1] + 50) + " L" + (t[0] - 16) + " " + (t[1] + 50) + " Z", t[2]) + P(M(t[0], t[1] + 24) + " L" + (t[0] + 20) + " " + (t[1] + 90) + " L" + (t[0] - 20) + " " + (t[1] + 90) + " Z", t[2]);

  // ---- the photographer, from behind, binoculars up -----------------------
  var KIT = {

  };
  function person(cx, fy, k) {
    var o = "", s = fy - 92, hip = fy - 48, id = "p" + (++uid);

  // ---- the rooms ----------------------------------------------------------
  function scene(habitat, id, birds) {

  function hide(habitat, id, birds) {

  function kitchen(id, birds) {
    var o = R(0, 0, 360, 240, "#efe6d4");

    // the washing up: a leaning tower of plates, bowls, mugs and a pan

  function svg(habitat, opts) {
    var id = "h" + (++uid), birds = (opts && opts.birds) || 0;

      (habitat === "garden" ? "Your kitchen window, looking out over the garden to the railway" : "Inside the hide, looking out over " + habitat) + '">' + body + '</svg>';
  }
  function figure(where) {
    return '<svg viewBox="118 76 140 164" xmlns="http://www.w3.org/2000/svg">' + R(118, 60, 140, 180, where === "kitchen" ? "#efe6d4" : "#8c6b4b") + person(188, 232, KIT[where] || KIT.hide) + '</svg>';
  }
  return { svg: svg, figure: figure, habitats: Object.keys(SCENE) };
})();

// photographs kept at the end of a session: 1 up to an hour, 2 up to two, then 3

var SITE = {}, DEX = [], DEXNO = {}, HOME = {};
ALBUM.sites.forEach(function (s) {

});
// the album runs in field-guide order, a page per group of birds (tools/families.py)
ALBUM.groups.forEach(function (g) { g[1].forEach(function (sci) { DEX.push(sci); DEXNO[sci] = DEX.length; }); });

// ---- rumours: a page with only its legendaries left makes them likelier ----

    PAGE_OF[sci][1].every(function (x) { return tierOf(x) === "Legendary" || S.album[x]; });
}

// ---- save ------------------------------------------------------------
// load() must sit below every name it reads (SAVE_KEY above all): in the old
// game a load() above its key ran in the temporal dead zone, threw, and the
// catch swallowed it, so every launch was a new game. It says out loud now.
var loadFound = false, writeErr = null;
function blank() {
  return { v: 1, started: false, minutes: 0, points: 0, day: 0, at: "garden", visited: { garden: 1 },

}
function load() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      loadFound = true;
      var o = JSON.parse(raw), b = blank();
      for (var k in o) b[k] = o[k];
      // saves from before points were called points
      if (o.miles != null && o.points == null) { b.points = o.miles; delete b.miles; }
      return b;
    }
  } catch (e) { writeErr = "could not read the save: " + e.message; }
  return blank();
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); writeErr = null; }
  catch (e) { writeErr = e.message; }
}
var S = load();

// ---- game time ---------------------------------------------------------
function doy(day) { return Math.floor(START_DAY + (day == null ? S.day : day)) % 360; }
function dateLabel(day) { var d = doy(day); return (d % 30 + 1) + " " + MONTHS[Math.floor(d / 30)]; }
function hm(min) { min = Math.floor(min); var h = Math.floor(min / 60), m = min % 60; return h ? h + "h " + (m < 10 ? "0" : "") + m + "m" : m + "m"; }

// ---- travel -------------------------------------------------------------
// A ticket costs a point a mile from the nearest place you have been, and a
// The Pass takes a third off.
// (a whole third comes off: 828 * (1 - 1/3) is 552.0000001 in floating point, and would round up)
function fare(miles) { return S.railcard ? miles - Math.floor(miles * RAILCARD_OFF + 1e-9) : miles; }
function dist(id) {
  var best = 1e9;
  for (var v in S.visited) if (RAIL.miles[v] && RAIL.miles[v][id] < best) best = RAIL.miles[v][id];
  return best;
}
function price(id) { return S.visited[id] ? 0 : fare(dist(id)); }
// where the cheapest ticket starts: the visited place nearest by rail
function origin(id) {
  var best = 1e9, from = S.at;
  for (var v in S.visited) if (RAIL.miles[v] && RAIL.miles[v][id] < best) { best = RAIL.miles[v][id]; from = v; }
  return from;
}
// the ticket that takes you somewhere: its own single, or the Rover covering it
function ticketKey(id) { return S.ticketFor[id] || (S.tickets[id] ? id : null); }

// free and the guard clips the same ticket, a Rover's too. Home needs none.
// Returns the ticket's key, or "home".
function travel(id) {
  var p = price(id);
  if (p > S.points || S.session) return null;
  var key = id === "garden" ? "home" : ticketKey(id);
  if (key && key !== "home") S.tickets[key].clips++;
  else if (!key) {
    key = id; S.ticketFor[id] = id;
    S.tickets[id] = { to: id, from: S.visited[id] ? S.at : origin(id), day: Math.floor(S.day), price: p, railcard: !!S.railcard, no: ++S.ticketNo, clips: 0 };
  }

}
// Rovers: one ticket for every place you have not been in an area of the map,
// cheaper than buying its singles one after another the cheapest way.
var ROVER_BANDS = [];
ALBUM.bands.forEach(function (b, i) { if (i > 1 && ALBUM.sites.filter(function (s) { return s.band === i; }).length >= 3) ROVER_BANDS.push(i); });
function roverName(band) { return ALBUM.bands[band].replace(" and ", " & ") + " Rover"; }
function rover(band) {
  var left = ALBUM.sites.filter(function (s) { return s.band === band && !S.visited[s.id]; }).map(function (s) { return s.id; });
  var have = Object.keys(S.visited), todo = left.slice(), miles = 0, from = null;
  while (todo.length) {
    var best = 1e9, bv = null, bs = null;
    have.forEach(function (v) { todo.forEach(function (x) { if (RAIL.miles[v] && RAIL.miles[v][x] < best) { best = RAIL.miles[v][x]; bv = v; bs = x; } }); });
    if (!bs) break;
    if (from === null) from = bv;
    miles += best; have.push(bs); todo.splice(todo.indexOf(bs), 1);

}
function buyRover(band) {
  var r = rover(band);

  var key = "rover" + band;
  S.tickets[key] = { rover: band, sites: r.sites, from: r.from, day: Math.floor(S.day), price: r.price, railcard: !!S.railcard, no: ++S.ticketNo, clips: 0 };
  r.sites.forEach(function (id) { S.visited[id] = 1; S.ticketFor[id] = key; });

}
function found(id) { return SITE[id].birds.filter(function (b) { return b.own && S.album[b.sci]; }).length; }

// ---- the session --------------------------------------------------------

function pick(site) {
  var pool = SITE[site].birds;
  var w = pool.map(function (b) { return b.weight * (rumoured(b.sci) ? LEGEND_BOOST : 1); });
  var tot = w.reduce(function (a, x) { return a + x; }, 0), r = Math.random() * tot;
  for (var i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i].sci; }
  return pool.length ? pool[pool.length - 1].sci : null;
}
function catchUp(now) {

}
var wake = null;
function startSession() {

  S.started = true; persist();

}

  var fresh = [];

  // rarest first: tier, then the smaller weight at this site
  var w = {}; SITE[sess.site].birds.forEach(function (b) { w[b.sci] = b.weight; });
  fresh.sort(function (a, b) { return (TIER_ORDER[tierOf(b)] - TIER_ORDER[tierOf(a)]) || (w[a] - w[b]); });

  var news = rumours().filter(function (sci) { return heard.indexOf(sci) < 0; });
  rolls.forEach(function (sci) { S.seen[sci] = (S.seen[sci] || 0) + 1; });
  var pages = ALBUM.groups.filter(function (g) { return g[1].every(function (x) { return S.album[x]; }) && g[1].some(function (x) { return kept.indexOf(x) >= 0; }); }).map(function (g) { return g[0]; });
  var railcard = !S.railcard && ALBUM.groups.filter(function (g) { return g[1].every(function (x) { return S.album[x]; }); }).length >= RAILCARD_PAGES;
  if (railcard) S.railcard = { day: Math.floor(day), no: ++S.ticketNo };

// ---- drawing: the map ---------------------------------------------------
var mapSel = S.at, mapCell = 4;
function drawMap() {
  var cv = document.getElementById("map"), wrap = cv.parentNode;
  var cs = Math.max(3, Math.floor((wrap.clientWidth - 6) / MAP.cols)); mapCell = cs;
  var W = MAP.cols * cs, H = MAP.rows * cs, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.maxWidth = W + "px";
  var g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.imageSmoothingEnabled = false;
  var grid = MAP.grid;
  function at(x, y) { return y < 0 || y >= MAP.rows || x < 0 || x >= MAP.cols ? "." : grid[y][x]; }
  g.fillStyle = "#5890d8"; g.fillRect(0, 0, W, H);
  for (var y = 0; y < MAP.rows; y++) for (var x = 0; x < MAP.cols; x++) {
    var v = grid[y][x];
    if (v === ".") {
      if ((x * 7 + y * 13) % 29 === 0) { g.fillStyle = "#88b8f0"; g.fillRect(x * cs, y * cs + cs / 2, cs * 2, Math.max(1, cs / 3)); }
      continue;
    }
    var coast = at(x - 1, y) === "." || at(x + 1, y) === "." || at(x, y - 1) === "." || at(x, y + 1) === ".";
    g.fillStyle = v === "g" ? (coast ? "#e8d898" : ((x + y) % 11 === 0 ? "#80c060" : "#90d070")) : (coast ? "#b8c0a8" : "#a8b898");
    g.fillRect(x * cs, y * cs, cs, cs);
  }
  // rails, then ferries, then the walk from each station to its site
  function P(xy) { return [xy[0] * cs, xy[1] * cs]; }
  RAIL.edges.forEach(function (e) {
    var a = P(RAIL.stations[e[0]]), b = P(RAIL.stations[e[1]]);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
    if (e[2] === "rail") {
      g.setLineDash([]); g.strokeStyle = "#5a3a22"; g.lineWidth = Math.max(2, cs * 0.75); g.stroke();
      g.setLineDash([1, Math.max(2, cs * 0.6)]); g.strokeStyle = "#e8c890"; g.lineWidth = Math.max(1, cs * 0.35); g.stroke();
    } else {
      g.setLineDash([cs, cs]); g.strokeStyle = "#fff"; g.lineWidth = Math.max(1.5, cs * 0.4); g.stroke();
    }
  });
  g.setLineDash([]);
  Object.keys(RAIL.sites).forEach(function (id) {
    var s = P(RAIL.sites[id].xy), st = P(RAIL.stations[RAIL.sites[id].station]);
    g.setLineDash([1, 2]); g.strokeStyle = "#3a2a1a"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(st[0], st[1]); g.lineTo(s[0], s[1]); g.stroke();
  });

  Object.keys(RAIL.stations).forEach(function (k) {
    var p = P(RAIL.stations[k]); g.fillStyle = "#fff"; g.fillRect(p[0] - 1, p[1] - 1, 2, 2);
  });
  // sites: red squares once visited, white before
  Object.keys(RAIL.sites).forEach(function (id) {
    var p = P(RAIL.sites[id].xy), r = Math.max(4, cs * 1.3);
    g.fillStyle = "#303038"; g.fillRect(p[0] - r - 1, p[1] - r - 1, r * 2 + 2, r * 2 + 2);
    g.fillStyle = S.visited[id] ? "#e84030" : (price(id) <= S.points ? "#f8c830" : "#f8f8f0");
    g.fillRect(p[0] - r, p[1] - r, r * 2, r * 2);
    if (id === mapSel) { g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(p[0] - r - 3, p[1] - r - 3, r * 2 + 6, r * 2 + 6); }
  });
  // you are here: a little red cap
  var me = P(RAIL.sites[S.at].xy), q = Math.max(3, cs);
  g.fillStyle = "#303038"; g.fillRect(me[0] - q * 1.5, me[1] - q * 4.2, q * 3, q * 2.6);
  g.fillStyle = "#e84030"; g.fillRect(me[0] - q * 1.2, me[1] - q * 3.9, q * 2.4, q * 1.2);
  g.fillStyle = "#f0c8a0"; g.fillRect(me[0] - q * 1.2, me[1] - q * 2.7, q * 2.4, q * 0.8);
}
function mapTap(ev) {
  var cv = document.getElementById("map"), r = cv.getBoundingClientRect();
  var x = (ev.clientX - r.left) * (MAP.cols * mapCell / r.width), y = (ev.clientY - r.top) * (MAP.rows * mapCell / r.height);
  var best = null, bd = 1e9;
  Object.keys(RAIL.sites).forEach(function (id) {

// ---- rendering the screens ----------------------------------------------

  var next = ROLL_MIN - (min % ROLL_MIN);
  box.innerHTML = '<div class="timer" id="clock">' + clock(min) + '</div>' +
    '<p style="text-align:center;margin:6px 0">' + sess.rolls.length + ' bird' + (sess.rolls.length === 1 ? "" : "s") + ' so far · next in ' + Math.ceil(next) + ' min</p>' +
    '<div class="slots">' + [1, 2, 3].map(function (i) { return '<span class="slot' + (i <= slots ? " on" : "") + '">' + (i <= slots ? "SNAP" : i === 2 ? "1h" : "2h") + '</span>'; }).join("") + '</div>' +
    '<p class="muted" style="text-align:center">The screen will go dark. Turn the brightness right down and get on with it.</p>' +
    '<div class="row" style="justify-content:center"><button class="btn quiet" id="stop">Finish session</button></div>';
  $("stop").onclick = function () { reveal(finishSession()); };
}
function clock(min) {
  var s = Math.floor(min * 60), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return (h ? h + ":" : "") + (m < 10 && h ? "0" : "") + m + ":" + (ss < 10 ? "0" : "") + ss;
}
function card(sci, big) {
  var a = S.album[sci], spec = SPECIES[nameOf(sci)];
  var tilt = big ? 0 : [-1.6, 1.2, -0.6, 1.8, -1.2, 0.8, 0.3][DEXNO[sci] % 7];
  return '<div class="print' + (big ? " bigprint" : "") + '" style="--tilt:' + tilt + 'deg">' + BIRD_RIG.svg(spec) + '<span class="date">' + (a ? dateLabel(a.day) : "") + '</span></div>';
}
function renderAlbum() {
  var n = Object.keys(S.album).length;
  $("albumcount").textContent = n + " of " + DEX.length;
  var html = "";
  ALBUM.groups.forEach(function (g) {
    var got = g[1].filter(function (sci) { return S.album[sci]; }).length, done = got === g[1].length;
    html += '<div class="grouphead' + (done ? " done" : "") + '"><span class="band">' + esc(g[0]) + '</span><span class="gcount">' + (done ? "Complete · " : "") + got + '/' + g[1].length + '</span></div><div class="grid">';
    g[1].forEach(function (sci) {
      var no = "#" + ("00" + DEXNO[sci]).slice(-3);
      if (S.album[sci]) html += '<button class="card" data-sci="' + esc(sci) + '">' + card(sci) + '<span class="nm">' + esc(nameOf(sci)) + '</span><span class="no">' + no + '</span></button>';
      else html += '<div class="card"><div class="unknown">?</div><span class="no">' + no + (tierOf(sci) === "Legendary" ? " · legendary" : "") + '</span></div>';
    });
    html += '</div>';
    g[1].filter(rumoured).forEach(function (sci) { html += '<p class="rumour">' + esc(rumourText(sci)) + '</p>'; });
  });
  var ids = Object.keys(S.tickets || {}).sort(function (a, b) { return S.tickets[a].no - S.tickets[b].no; });
  html += '<details class="wallet"' + (ids.length || S.railcard ? "" : " hidden") + '><summary>Ticket wallet · ' + ids.length + ' ticket' + (ids.length === 1 ? "" : "s") + (S.railcard ? " and a Twitcher's Pass" : "") + '</summary>' +
    '<p class="walletnote">Tap a ticket to turn it over.</p>' + (S.railcard ? railcardHTML() : "") + ids.map(function (k) { return ticketHTML(k); }).join("") + '</details>';
  $("albumbody").innerHTML = html;
  Array.prototype.forEach.call($("albumbody").querySelectorAll("button.card"), function (b) { b.onclick = function () { detail(b.dataset.sci); }; });
  $("savebox").innerHTML = '<h2 class="h">Your save</h2><p>' + hm(S.minutes) + ' focused over ' + S.sessions + ' session' + (S.sessions === 1 ? "" : "s") + '.</p>' +
    '<p class="muted">' + (writeErr ? 'Saving is failing: ' + esc(writeErr) : loadFound ? 'Saved on this device, and found again when the page opened.' : 'Saved on this device.') + '</p>' +
    (SANDBOX ? '<p class="muted">This is the sandbox: the clock runs ' + SPEED + ' times faster, points never run out, and its save is separate from the real game.</p>' +
               '<button class="btn quiet" id="wipe">Start the sandbox again</button>' : '') +
    CREDITS;
  if ($("wipe")) $("wipe").onclick = function () {
    if (!confirm("Wipe the sandbox and start from the beginning?")) return;
    persist = function () {};  // or a session ending as the page hides would write the old save back
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  };
}

// The eBird data is CC BY 4.0, which requires this attribution wherever the
// game is shown. Keep it, and keep it reachable.
var CREDITS = '<details class="credits"><summary>Credits</summary>' +
  '<p>Where the birds live and how common they are comes from the <b>eBird Observation Dataset</b>, Cornell Lab of Ornithology, ' +
  'accessed via GBIF.org (doi.org/10.15468/aomfnb), licensed CC BY 4.0. The game adapts it: sites and rarity are simplified and tuned for play, and there are no seasons.</p>' +
  '<p>Coastline from Natural Earth (public domain). Fonts: Kalam, Share Tech Mono and Doto (SIL Open Font License), Permanent Marker (Apache License 2.0). ' +
  'Birds, hides and railway drawn for this game.</p>' +
  '<p>Twitcher is not affiliated with or endorsed by any railway company, nature reserve or conservation charity. Reserve and station names are used only to say where things are.</p></details>' +
  '<details class="credits"><summary>Privacy</summary>' +
  '<p>Your save stays on this device, in your browser\'s storage. There are no accounts, no adverts and no tracking, and the game sends nothing anywhere: even its fonts are built in. ' +
  'Clearing this site\'s data in your browser deletes your save.</p>' +
  '<p>The game is hosted on GitHub Pages. Like any web host, GitHub logs the IP address of each visit for security; see GitHub\'s privacy statement.</p></details>';

// ---- tickets: the orange-striped card ticket ------------------------------
// the rail map treats London as one station; a ticket names the local one
var LOCAL_STATION = { garden: "London Terminals", barnes: "Barnes", walthamstow: "Tottenham Hale" };
function stationOf(id) { return LOCAL_STATION[id] || RAIL.sites[id].station; }
var stampNo = 0;
// the rarest bird photographed at the places a ticket covers: the stamp on its back
function stampBird(t, key) {
  var sites = t.rover != null ? t.sites : [t.to || key], best = null;
  DEX.forEach(function (sci) {
    var a = S.album[sci];
    if (a && sites.indexOf(a.site) >= 0 && (!best || TIER_ORDER[tierOf(sci)] > TIER_ORDER[tierOf(best)])) best = sci;
  });
  return best;
}
// a rubber stamp in blue ink: the bird's own picture, with everything pale
// dropped out by the filter, inside a ring lettered with the place and the date
function stamp(sci, where) {
  var id = "st" + (++stampNo), ink = "#3f4a96", a = S.album[sci];
  var top = where.split(",")[0].toUpperCase(), low = (nameOf(sci) + " · " + dateLabel(a.day)).toUpperCase();
  function fs(txt, room) { return Math.min(8.4, Math.max(4, (room / txt.length - 1) * 2)).toFixed(1); }
  var bird = BIRD_RIG.svg(SPECIES[nameOf(sci)]).replace("<svg ", '<svg x="19" y="19" width="62" height="62" ');
  return '<svg class="stamp" viewBox="0 0 100 100" role="img" aria-label="Stamp: ' + esc(nameOf(sci)) + ' at ' + esc(where) + '"><defs>' +
    '<filter id="' + id + 'f"><feColorMatrix type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.29  0 0 0 0 0.59  -0.9 -1.2 -0.4 0 1.95"/></filter>' +
    '<clipPath id="' + id + 'c"><circle cx="50" cy="50" r="30"/></clipPath>' +
    '<path id="' + id + 't" d="M 14 50 A 36 36 0 0 1 86 50"/><path id="' + id + 'b" d="M 11 50 A 39 39 0 0 0 89 50"/></defs>' +
    '<circle cx="50" cy="50" r="47" fill="none" stroke="' + ink + '" stroke-width="3"/><circle cx="50" cy="50" r="31.5" fill="none" stroke="' + ink + '" stroke-width="1.4"/>' +
    '<g clip-path="url(#' + id + 'c)" filter="url(#' + id + 'f)">' + bird + '</g>' +
    '<g font-family="Share Tech Mono, monospace" fill="' + ink + '" text-anchor="middle" letter-spacing="1">' +
    '<text font-size="' + fs(top, 110) + '"><textPath href="#' + id + 't" startOffset="50%">' + esc(top) + '</textPath></text>' +
    '<text font-size="' + fs(low, 118) + '"><textPath href="#' + id + 'b" startOffset="50%">' + esc(low) + '</textPath></text></g></svg>';
}
function ticketHTML(key, fresh) {
  var t = S.tickets[key], rov = t.rover != null, to = rov ? null : (t.to || key);
  function f(label, val, cls) { return '<span class="tk-f' + (cls ? " " + cls : "") + '"><small>' + label + '</small><b>' + esc(val) + '</b></span>'; }
  var clips = "";
  for (var i = 0; i < t.clips; i++) clips += '<i class="clip' + (fresh && i === t.clips - 1 ? " fresh" : "") + '" style="left:' + (58 + (i * 7) % 36) + '%;top:' + (i % 2 ? 4 : 2) + '%"></i>';
  var dest = rov ? roverName(t.rover) : stationOf(to);
  var front = '<div class="ticket front">' +
    '<div class="tk-band"><span>Twitcher Rail</span><span>Standard</span></div>' +
    '<div class="tk-body">' +
      f("Class", "Std") + f("Ticket type", rov ? "Rover" : "Birder single") + f("Pass", t.railcard ? "Twitcher" : "None") +
      f("Start date", dateLabel(t.day)) + f("Number", ("0000" + t.no).slice(-5)) + f("Price", t.price ? t.price + " pts" : "Free") +
      f("From", stationOf(t.from), "wide big") + f(rov ? "Valid in" : "To", rov ? ALBUM.bands[t.rover] : dest, "wide big") +
      f("Route", rov ? "Any permitted · " + t.sites.length + " reserves, as often as you like" : "Any permitted · for " + siteName(to), "wide route") +
    '</div><div class="tk-band low"><span>' + (rov ? "Show it on every trip: the guard clips it" : "Keep your ticket: going back is free") + '</span></div>' + clips + '</div>';
  var best = stampBird(t, key);
  var back = '<div class="ticket back"><div class="tk-stripe"></div>' +
    '<div class="tk-small">' + (rov ? 'Valid for ' + esc(t.sites.map(siteName).join(", ")) + '. ' : '') +
    'Issued subject to the Twitcher conditions of travel: phone face down, eyes open.</div>' +
    (best ? stamp(best, rov ? roverName(t.rover) : siteName(to)) : '<div class="nostamp">No stamp yet. Photograph a bird here and it gets stamped.</div>') + '</div>';
  return '<div class="tkcard" role="button" tabindex="0" aria-label="Ticket to ' + esc(dest) + '. Tap to turn it over."><div class="faces">' + front + back + '</div></div>';
}
function railcardHTML() {
  return '<div class="railcard" role="img" aria-label="Twitcher\'s Pass: a third off every ticket">' +
    '<div class="rc-top"><span>Twitcher\'s Pass</span><b>1/3 off</b></div>' +
    '<div class="rc-body"><div class="rc-photo">' + HIDE_RIG.figure("hide") + '</div><div class="rc-f">' +
      '<small>Holder</small><b>A. Birder</b><small>Number</small><b>' + ("0000" + S.railcard.no).slice(-5) + '</b>' +
      '<small>Valid from</small><b>' + dateLabel(S.railcard.day) + '</b><small>Valid until</small><b>Forever</b></div></div>' +
    '<div class="rc-foot">Awarded for completing ' + RAILCARD_PAGES + ' pages of the album</div></div>';
}
// kind: "bought" a single, "clip" a trip on a ticket you have, "rover" bought
function showTicket(key, id, kind) {
  var t = S.tickets[key], rov = t.rover != null, msg;
  if (kind === "clip") msg = 'To ' + esc(siteName(id)) + ' on your ' + (rov ? esc(roverName(t.rover)) : 'ticket') + '. The guard clips it.';
  else if (kind === "rover") msg = 'Every reserve it covers is now free to reach, as often as you like: ' + esc(t.sites.map(siteName).join(', ')) + '. Pick one on the map.';
  else msg = t.price + ' points from ' + esc(stationOf(t.from)) + ' to ' + esc(stationOf(id)) + (t.railcard ? ', with your Pass' : '') + '. It goes in your wallet at the back of the album, and it takes you back here for free whenever you like.';
  overlay('<div class="panel dark"><h2 class="h" style="color:#f1eee4">' + (kind === "clip" ? "Ticket clipped" : kind === "rover" ? "Rover bought" : "Ticket bought") + '</h2>' +
    '<div class="tkwrap">' + ticketHTML(key, kind === "clip") + '</div><p>' + msg + '</p>' +
    '<button class="btn" id="close">' + (kind === "rover" ? "Back to the map" : "To the hide") + '</button></div>');
  $("close").onclick = function () { closeOverlay(); show(kind === "rover" ? "map" : "hide"); };
}
// any ticket turns over when tapped
document.addEventListener("click", function (e) { var c = e.target.closest && e.target.closest(".tkcard"); if (c) c.classList.toggle("flipped"); });
document.addEventListener("keydown", function (e) {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("tkcard")) { e.preventDefault(); e.target.classList.toggle("flipped"); }
});
function detail(sci) {
  var a = S.album[sci];
  overlay('<div class="panel dark">' + card(sci, true) + '<div class="caption"><span class="nm">' + esc(nameOf(sci)) + '</span><span class="sci">' + esc(sci) + '</span>' +
    '<span>' + esc(siteName(a.site)) + ', ' + dateLabel(a.day) + '</span><span style="color:#aeb8a9">after ' + hm(a.min) + ' in the hide · ' + tierOf(sci).toLowerCase() + '</span></div>' +
    '<button class="btn quiet" id="close">Close</button></div>');
  $("close").onclick = closeOverlay;
}
function reveal(r) {
  if (!r) return;
  render();
  var html = '<div class="panel dark"><h2 class="h" style="color:#f1eee4">' + (r.min < ROLL_MIN ? "Too short to see anything" : "Session over") + '</h2>' +
    '<p>' + hm(r.min) + ' at ' + esc(siteName(r.site)) + '. You earned ' + r.points + ' points' +
    (r.bonus ? ', and a bonus of <b class="bonus">' + r.bonus + '</b> for ' + (r.kept.filter(function (s) { return BONUS[tierOf(s)]; }).length > 1 ? 'your rare finds' : 'a rare find') : '') + '.</p>';
  if (r.rolls.length) {
    var counts = {}; r.rolls.forEach(function (s) { counts[s] = (counts[s] || 0) + 1; });
    html += '<p class="seen">You saw: ' + Object.keys(counts).map(function (s) { return esc(nameOf(s)) + (counts[s] > 1 ? " ×" + counts[s] : ""); }).join(", ") + '.</p>';
  }
  if (r.kept.length) {
    html += '<div class="reveal">' + r.kept.map(function (sci) {
      return '<div class="card" style="position:relative">' + card(sci) + '<span class="new">NEW</span><span class="nm">' + esc(nameOf(sci)) + '</span><span class="no">' + tierOf(sci).toLowerCase() + (BONUS[tierOf(sci)] ? ' · +' + BONUS[tierOf(sci)] + ' points' : '') + '</span></div>';
    }).join("") + '</div>';
  } else if (r.rolls.length) html += '<p>Nothing new for the album this time.</p>';
  (r.pages || []).forEach(function (t) { html += '<p class="pagedone">Page complete: ' + esc(t) + '</p>'; });
  var told = {};
  (r.news || []).forEach(function (sci) {
    var t = PAGE_OF[sci][0];
    var many = PAGE_OF[sci][1].filter(function (x) { return tierOf(x) === "Legendary"; }).length > 1;
    if (!told[t]) html += '<p class="pagedone">Nearly there: ' + esc(t) + '. Only the legendar' + (many ? 'ies are' : 'y is') + ' left.</p>';
    told[t] = 1;
    html += '<p class="rumour">' + esc(rumourText(sci)) + '</p>';
  });
  if (r.railcard) html += '<div class="tkwrap">' + railcardHTML() + '</div><p>That is ' + RAILCARD_PAGES + ' pages of the album done, and it earns you a Twitcher\'s Pass: a third off every ticket from now on. It is in your wallet.</p>';
  html += '<button class="btn" id="close">Back to the map</button></div>';
  overlay(html);
  $("close").onclick = function () { closeOverlay(); show("map"); };
}
function overlay(html) { $("overlay").innerHTML = '<div class="overlay" role="dialog" aria-modal="true">' + html + '</div>'; }
function closeOverlay() { $("overlay").innerHTML = ""; }

function show(t) {
  tab = t;
  ["map", "hide", "album"].forEach(function (k) {
    $("s-" + k).hidden = k !== t; $("t-" + k).setAttribute("aria-selected", String(k === t));
  });
  render();
}
function render() {
  renderTop();
  if (tab === "map") renderMap();
  if (tab === "hide") renderHide();
  if (tab === "album") renderAlbum();
}

// ---- the dark screen ---------------------------------------------------
var darkTimer = null;
function armDark() { clearTimeout(darkTimer); if (S.session) darkTimer = setTimeout(function () { $("dark").classList.add("on"); }, DARK_MS); }
function lightUp() { $("dark").classList.remove("on"); clearTimeout(darkTimer); }
$("dark").onclick = function () { lightUp(); armDark(); };

// ---- the clock ---------------------------------------------------------
setInterval(function () {
  if (!S.session) return;
  var before = S.session.rolls.length;
  catchUp(); S.session.last = Date.now();
  if (S.session.rolls.length !== before) { persist(); if (tab === "hide") drawHide(); }
  if (tab === "hide" && !$("dark").classList.contains("on")) renderHide();
  if (Date.now() % 30000 < 1000) persist();
}, 1000);
// Leaving the page ends the session. What you have seen so far still counts.
document.addEventListener("visibilitychange", function () {
  if (document.hidden && S.session) { var r = finishSession(); if (r) pending = r; }
  else if (!document.hidden && pending) { reveal(pending); pending = null; }
});
var pending = null;

// ---- the opening ---------------------------------------------------------
$("t-map").onclick = function () { show("map"); };
$("t-hide").onclick = function () { show("hide"); };
$("t-album").onclick = function () { show("album"); };
$("map").addEventListener("click", mapTap);
window.addEventListener("resize", function () { if (tab === "map") drawMap(); });

// A session left running when the page was closed ends where its last heartbeat was.
if (S.session) pending = finishSession(S.session.last || S.session.start);

if (!S.started) {
  overlay('<div class="panel box"><h2 class="h">Twitcher</h2>' +
    '<p>You are a wildlife photographer, and you live in London. For now the only place you can watch from is your kitchen window.</p>' +
    '<p>Focus on your work and the birds come to you: one every 15 minutes. Stay longer and you get more photographs. Up to an hour gets one, then two, and over two hours gets three.</p>' +
    '<p>Every minute of focus earns half a point, and rare birds earn a bonus. Spend points on train tickets to real reserves around Britain, each with birds of its own.</p>' +
    '<button class="btn" id="begin">Start in the garden</button></div>');
  $("begin").onclick = function () { S.started = true; persist(); closeOverlay(); show("hide"); };
}
show(S.started ? "map" : "hide");
if (pending) { reveal(pending); pending = null; }
</script>
</body></html>
